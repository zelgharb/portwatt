version: '3.8'

services:
  # Base de données PostgreSQL avec extension TimescaleDB (Séries temporelles ISO 50001)
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: portwatt-db
    restart: always
    environment:
      POSTGRES_DB: portwatt_db
      POSTGRES_USER: portwatt_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-PortWattSecure2026!}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portwatt_admin -d portwatt_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Node.js / TypeScript - Fastify + Acquisition Modbus TCP + SSE
  api-service:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: portwatt-api
    restart: always
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://portwatt_admin:${DB_PASSWORD:-PortWattSecure2026!}@timescaledb:5432/portwatt_db
      JWT_SECRET: ${JWT_SECRET:-portwatt-jwt-super-secret-key-32chars}
      MODBUS_MODE: ${MODBUS_MODE:-real} # 'real' ou 'simulated'
      LDAP_URL: ${LDAP_URL:-ldap://ad.marsamaroc.co.ma:389}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-DC=marsamaroc,DC=co,DC=ma}
    ports:
      - "4000:4000"

  # Frontend Nginx optimisé (Build React + Routage SPA + En-têtes sécurité)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portwatt-ui
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api-service

volumes:
  pgdata:
